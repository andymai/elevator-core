name: Benchmarks (nightly)

on:
  schedule:
    # 08:00 UTC daily
    - cron: '0 8 * * *'
  workflow_dispatch:

# Don't run on forks — the comparison baseline lives on this repo.
jobs:
  bench:
    if: github.repository == 'andymai/elevator-core'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize gh-pages pushes against `docs.yml` (which uses the same
    # group). Otherwise a docs deploy and a manually-triggered bench run
    # can race and the second `git push` is rejected as non-fast-forward.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      # `contents: write` is needed to push the time-series dashboard data
      # to gh-pages. `issues: write` keeps the existing regression-issue
      # creation behaviour working.
      contents: write
      issues: write
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      # Pinned, NOT @stable. The comparison baseline is a rolling median of
      # recent nightly measurements; comparing it against a run built by a
      # newer stable rustc conflates compiler codegen drift with code changes,
      # which
      # is exactly how an unpinned @stable produced ~2 weeks of phantom
      # +13–20% regressions (issue #884). Bump this deliberately when
      # adopting a new toolchain — the history auto-re-establishes
      # because the state path below is keyed on `rustc --version`.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-criterion
          cache-targets: true

      # Capture the exact compiler version into the env so the measurement
      # history path can include it. Any toolchain change (the pin above, or
      # even a patch release) then lands on a fresh path and the history
      # rebuilds from scratch instead of reporting compiler drift as a code
      # regression. Absolute timings are compiler-dependent, so a history
      # must never span toolchains.
      # Whitelist-sanitize to chars safe in a single path segment, so a future
      # rustc format change (channel suffix, date-delimiter tweak) can't
      # corrupt the path.
      - name: Record rustc version for the history path
        run: echo "RUSTC_VER=$(rustc --version | sed 's/[^a-zA-Z0-9._-]/_/g')" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      # Restore the rolling per-bench measurement history. The detect step
      # compares tonight against the *median* of recent nightlies that ran on
      # the same machine class, rather than against a single frozen prior
      # measurement. The `ubuntu-latest` pool cycles between CPU SKUs whose
      # whole-suite spread (-20% to +12%) dwarfs any effect worth alerting on,
      # so an unstratified median blends hardware and measures which machine
      # the run drew rather than the code. Retention spans several weeks
      # because only same-class nightlies are eligible as baseline samples.
      #
      # This replaces the per-SHA criterion baseline lock (#734). That lock
      # froze the comparison point at the first nightly to measure a commit,
      # which made the two-day persistence gate structurally unable to do its
      # job: a real regression showed up for exactly one night (the nightly
      # after the new SHA landed), and that same night re-locked the baseline,
      # so every subsequent night compared the SHA against itself. Only noise
      # recurs under that scheme, so only noise was ever confirmed — see
      # #923/#924.
      #
      # The previous nightly's regression-name list comes back alongside it,
      # so the detect step can gate issue-open on two-day persistence. When
      # the list is absent the detect step falls back to single-run behaviour.
      #
      # Both live on gh-pages under bench/state/<rustc>/ rather than in the
      # Actions cache. The repo's cache sits at its 10 GB cap and every
      # lockfile bump saves several GB of rust-cache entries, so LRU eviction
      # drops the day-old history and list together and the baseline restarts
      # from empty. The path carries `RUSTC_VER` so a
      # toolchain bump starts a fresh history instead of charging the
      # compiler's codegen drift to the code as a phantom regression (issue
      # #884). Absolute timings are compiler-dependent, so history must not
      # span toolchains.
      - name: Restore detector state
        run: |
          state="bench/state/${RUSTC_VER}"
          git fetch --depth=1 origin gh-pages
          git show "FETCH_HEAD:${state}/history.json" > bench-history.json \
            || rm -f bench-history.json
          git show "FETCH_HEAD:${state}/regressions.txt" > regressions-previous.txt \
            || rm -f regressions-previous.txt

      - name: Run benchmarks
        id: bench
        run: |
          set -o pipefail
          # Pre-compile all benches so cargo's "Updating/Downloading/Compiling"
          # output doesn't land in bench-output.log (parsed by the publish step).
          # On a cold build it otherwise pollutes the log and github-action-
          # benchmark reports "No benchmark result was found".
          cargo bench -p elevator-core --no-run
          cargo bench -p elevator-core --bench sim_bench         -- --save-baseline nightly 2>&1 | tee -a bench-output.log
          cargo bench -p elevator-core --bench scaling_bench     -- --save-baseline nightly 2>&1 | tee -a bench-output.log
          cargo bench -p elevator-core --bench dispatch_bench    -- --save-baseline nightly 2>&1 | tee -a bench-output.log
          cargo bench -p elevator-core --bench multi_line_bench  -- --save-baseline nightly 2>&1 | tee -a bench-output.log
          cargo bench -p elevator-core --bench query_bench       -- --save-baseline nightly 2>&1 | tee -a bench-output.log
          # Runner-speed calibration — no elevator-core code. The detect step
          # measures it against its own rolling median and divides that factor
          # back out of every real bench, cancelling the shared `ubuntu-latest`
          # speed variance that otherwise reads as a uniform across-the-board
          # regression (#907/#908/#913/#914/#916).
          cargo bench -p elevator-core --bench calibration_bench -- --save-baseline nightly 2>&1 | tee -a bench-output.log

      # Compare tonight's per-bench mean (read from Criterion's
      # estimates.json, not its `change:` lines) against the median of recent
      # nightlies on the same machine class. The calibration bench identifies
      # the class: its reading is sharply quantized, holding within 1% across
      # repeat visits to one SKU while classes sit 10-15% apart. A bench is
      # reported when it exceeds that median by more than MIN_CHANGE_PCT after
      # the residual within-class runner drift is divided out
      # (#907/#908/#913/#914/#916), *and* it also appeared on the previous
      # nightly's list (the recurrence-as-signal heuristic from #734).
      #
      # The median baseline is what makes that recurrence gate meaningful: it
      # stays put night to night, so a genuine regression keeps clearing the
      # threshold until enough post-regression nights accumulate to move the
      # median. Under the old per-SHA freeze the baseline re-locked the same
      # night the regression appeared, so the gate could only ever confirm
      # noise (#923/#924).
      #
      # MIN_CHANGE_PCT is 25 because two noise sources that involve no
      # elevator-core code reach ~22%. Every rebuild re-rolls code layout,
      # which steps the memory-heavy benches in either direction: a release
      # commit that only bumped the crate version moved `scaling_*` by ~30%
      # (#942). The microsecond-scale benches (`query_*`,
      # `dynamic_topology/*`) swing ±10-30% night to night on the same binary
      # and machine class. Backtesting this detector over 91 nightlies with no
      # performance-relevant code change filed 32 spurious issues at 5%, 5 at
      # 20% and none at 25%, while still confirming over 80% of synthetic 30%
      # regressions. Smaller regressions are below what this runner pool can
      # resolve from absolute timings.
      - name: Detect regressions
        id: detect
        env:
          MIN_CHANGE_PCT: '25.0'
        run: |
          python3 .github/scripts/detect-bench-regressions.py \
            "$GITHUB_OUTPUT" "$MIN_CHANGE_PCT" target/criterion \
            bench-history.json regressions-previous.txt

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-output-${{ github.run_id }}
          path: |
            target/criterion
            bench-output.log
          retention-days: 30

      # Open the regression issue *before* publishing to gh-pages so a
      # `git push` failure in the publish step (rate-limit, non-fast-forward,
      # auth hiccup) does not silently suppress the alert via the implicit
      # `success()` gate on the issue step's `if:` condition.
      #
      # Scheduled runs only, matching the state-save guard. A dispatch run
      # restores the last nightly's regression list and compares against the
      # same history, so it would re-confirm a live regression and file a
      # duplicate issue without a night boundary having passed. Dispatch
      # stays a read-only preview: the finding is still printed in the step
      # log and the `regressed` output is still set.
      - name: Open issue on regression
        if: steps.detect.outputs.regressed == 'true' && github.event_name == 'schedule'
        env:
          GATE: ${{ steps.detect.outputs.gate }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gate = process.env.GATE || 'unknown';
            const header = gate === 'two-day'
              ? 'Nightly benchmark run flagged a regression against the rolling median of recent nightlies (confirmed on two consecutive nightlies).'
              : 'Nightly benchmark run flagged a regression against the rolling median of recent nightlies. ' +
                'Single-run gate (no previous-nightly list stored yet).';
            const body = [
              header,
              '',
              '```',
              fs.readFileSync('regressions.txt', 'utf8').slice(0, 4000),
              '```',
              '',
              `Full artifact: criterion-output-${{ github.run_id }}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Bench regression on ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['perf', 'automated'],
            });

      # Persist the history with tonight's sample appended (the detect step
      # rewrote the file in place, after doing its comparison, so tonight
      # never influenced the median it was measured against), plus tonight's
      # regression list for tomorrow's two-day gate.
      #
      # Scheduled runs only. A `workflow_dispatch` preview reads the stored
      # state but must not inject a sample into the rolling reference, and two
      # same-day dispatches saving their lists would cross-confirm each other
      # and fire the two-day gate without a night boundary passing.
      #
      # Gated on the detect step rather than the default `success()`, so an
      # issue-creation failure above does not also drop tonight's sample and
      # the list tomorrow's gate confirms against.
      #
      # The commit is built in a scratch worktree and pushed from the main
      # checkout, so the push uses the credentials actions/checkout configured
      # for the workspace. The `pages` concurrency group keeps docs deploys
      # from racing it; the retry covers transient push failures.
      - name: Save detector state
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.detect.outcome == 'success' }}
        run: |
          state="bench/state/${RUSTC_VER}"
          pages="$RUNNER_TEMP/gh-pages"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$pages" FETCH_HEAD
          mkdir -p "$pages/$state"
          cp bench-history.json "$pages/$state/history.json"
          cp regressions-current.txt "$pages/$state/regressions.txt"
          git -C "$pages" add "$state"
          git -C "$pages" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "bench: detector state for ${GITHUB_SHA::8}"
          commit=$(git -C "$pages" rev-parse HEAD)
          for attempt in 1 2 3; do
            git push origin "$commit:refs/heads/gh-pages" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          git worktree remove "$pages"

      # Publish a time-series dashboard at andymai.github.io/elevator-core/bench/.
      # Parses Criterion's output from `bench-output.log` (already captured by
      # `tee -a` above) and pushes per-bench history to gh-pages/bench/. The
      # docs.yml workflow uses `keep_files: true` to preserve this directory
      # across docs deploys.
      # github-action-benchmark's `cargo` parser wants libtest "bencher"
      # lines, which Criterion never emits. Generate them from Criterion's
      # JSON estimates so bench-output.log stays in its native format for
      # the regression detector above.
      - name: Convert Criterion results to bencher format
        run: python3 .github/scripts/criterion-to-bencher.py > bench-bencher.txt

      - name: Publish bench history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: bench-bencher.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          # Non-blocking — the existing `Open issue on regression` step
          # already alerts on Criterion's own regression detection.
          alert-threshold: '110%'
          fail-on-alert: false
